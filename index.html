<style>

<script>

{id:"c1",name:"Seva Youth Club Camp",venue:"Community Hall, Ward 4",off:2,s:9,e:14,org:"Seva Youth Club",cap:8,focus:["O-","B-"],desc:"Neighbourhood camp with refreshments and a doctor on site."},

{id:"c7",name:"Year-End Giving Camp",venue:"Public Library Hall",off:52,s:10,e:15,org:"Lifeline NGO",cap:10,focus:["B-","AB-"],desc:"A year-end camp for families and first-time donors."},
{id:"c8",name:"New Year Blood Drive",venue:"Community Centre",off:68,s:9,e:13,org:"Seva Youth Club",cap:8,focus:["O-","B-","A-"],desc:"Start the year with a donation."},

].map(c=>({...c,date:iso(day(c.off))}));
